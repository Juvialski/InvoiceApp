name: Finalize PHP-only demo currency fix

on:
  push:
    branches:
      - fix/php-only-demo-reporting
    paths:
      - .github/workflows/php-demo-currency-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/php-only-demo-reporting
          fetch-depth: 0
      - name: Remove unsupported synthetic FX conversion
        shell: python
        run: |
          from pathlib import Path

          p = Path("src/demo/data/financial.ts")
          text = p.read_text(encoding="utf-8")
          old = '    ["20", DEMO_PROJECT_IDS.solar, 137_812.50, "Foreign site services", "Converted PHP value for site licensing and document-control service charge", "International Site Services", "APPROVED"],\n'
          if old not in text:
              raise SystemExit("Expected converted demo-expense-20 row not found")
          p.write_text(text.replace(old, ""), encoding="utf-8")

          p = Path("tests/demoPhpCurrency.test.ts")
          text = p.read_text(encoding="utf-8")
          old = '''\n  const expense20 = workspace.expenses.find((expense) => expense.id === "demo-expense-20");\n  assert.ok(expense20);\n  assert.equal(expense20.currency, "PHP");\n  assert.equal(expense20.amount, 137_812.50);'''
          if old not in text:
              raise SystemExit("Expected demo-expense-20 test block not found")
          text = text.replace(old, '')
          text = text.replace(
              'test("former USD demo samples retain their explicit converted PHP values", () => {',
              'test("demo samples with prior explicit FX evidence retain their converted PHP values", () => {'
          )
          p.write_text(text, encoding="utf-8")
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/php-demo-currency-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/demo/data/financial.ts tests/demoPhpCurrency.test.ts .github/workflows/php-demo-currency-finalize.yml
          git commit -m "fix: avoid unsupported demo FX conversion"
          git push origin HEAD:fix/php-only-demo-reporting
