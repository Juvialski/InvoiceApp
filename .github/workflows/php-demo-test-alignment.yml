name: Align PHP-only demo regression tests

on:
  push:
    branches:
      - fix/php-only-demo-reporting
    paths:
      - .github/workflows/php-demo-test-alignment.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/php-only-demo-reporting
          fetch-depth: 0
      - name: Update stale mixed-currency demo assertions
        shell: python
        run: |
          from pathlib import Path

          p = Path("tests/demoWorkspace.test.ts")
          text = p.read_text(encoding="utf-8")
          old = '''test("demo portfolio fixtures cover multiple currencies plus partial and unavailable truth", () => {\n  const data = workspace();\n  const summaries = buildDemoProjectSummaries(data);\n  const views = data.projects.map((project) => buildProjectManagementView(project, summaries[project.id]!, {\n    clientBillings: data.clientBillings || [],\n    clientCollections: data.clientCollections || [],\n  }));\n  const portfolio = buildPortfolioManagementSummary(views);\n  const planning = views.find((view) => view.project.id === "demo-project-international");\n  const solar = views.find((view) => view.project.id === "demo-project-solar");\n\n  assert.ok(portfolio.currencies.includes("PHP"));\n  assert.ok(portfolio.currencies.includes("USD"));\n  assert.equal(planning?.financialTruth.contractValue.status, "unavailable");\n  assert.equal(planning?.financialTruth.remainingToBill.status, "unavailable");\n  assert.equal(solar?.financialTruth.actualCost.status, "partial");\n  assert.ok((summaries["demo-project-solar"]?.foreignCosts.USD || 0) > 0);\n});'''
          new = '''test("demo portfolio fixtures use PHP-only monetary values plus unavailable planning truth", () => {\n  const data = workspace();\n  const summaries = buildDemoProjectSummaries(data);\n  const views = data.projects.map((project) => buildProjectManagementView(project, summaries[project.id]!, {\n    clientBillings: data.clientBillings || [],\n    clientCollections: data.clientCollections || [],\n  }));\n  const portfolio = buildPortfolioManagementSummary(views);\n  const planning = views.find((view) => view.project.id === "demo-project-international");\n  const solar = views.find((view) => view.project.id === "demo-project-solar");\n\n  assert.ok(portfolio.currencies.includes("PHP"));\n  assert.equal(portfolio.currencies.includes("USD"), false);\n  assert.equal(planning?.financialTruth.contractValue.status, "unavailable");\n  assert.equal(planning?.financialTruth.remainingToBill.status, "unavailable");\n  assert.equal(solar?.financialTruth.actualCost.status, "available");\n  assert.equal(summaries["demo-project-solar"]?.foreignCosts.USD || 0, 0);\n});'''
          if old not in text:
              raise SystemExit("Expected demoWorkspace mixed-currency test block not found")
          p.write_text(text.replace(old, new), encoding="utf-8")

          p = Path("tests/p3a3P3dIntegration.test.ts")
          text = p.read_text(encoding="utf-8")
          old = '  assert.equal(flags(solar).has("MIXED_CURRENCY"), true);'
          new = '  assert.equal(flags(solar).has("MIXED_CURRENCY"), false);'
          if old not in text:
              raise SystemExit("Expected solar MIXED_CURRENCY assertion not found")
          p.write_text(text.replace(old, new), encoding="utf-8")
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/php-demo-test-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/demoWorkspace.test.ts tests/p3a3P3dIntegration.test.ts .github/workflows/php-demo-test-alignment.yml
          git commit -m "test: align demo expectations with PHP-only fixtures"
          git push origin HEAD:fix/php-only-demo-reporting
