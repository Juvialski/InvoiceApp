name: Continuation hardening validation

on:
  push:
    branches:
      - refactor/single-company-deployment

permissions:
  contents: write

jobs:
  app-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reconstructed continuation patch
        run: node scripts/continuation-hardening-patch.mjs
      - name: Install and refresh lockfile
        run: npm install
      - name: Regenerate workflow map
        run: npm run workflow-map:generate
      - name: Workflow map check
        run: npm run workflow-map:check
      - name: Workflow map consistency
        run: npm run workflow-map:consistency
      - name: Workflow map tests
        run: npm run test:workflow-map
      - name: Full tests
        run: npm test
      - name: TypeScript lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/engoryx-preview.log 2>&1 &
          echo $! > /tmp/engoryx-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/demo >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/engoryx-preview.log
          exit 1
      - name: Demo QA
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run qa:demo
      - name: Diff check
        run: git diff --check
      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/lib/persistence.ts src/lib/engineeringDocumentsPersistence.ts src/lib/payrollImportPersistence.ts src/lib/payrollImport.ts server.ts scripts/workflow-map/graph.ts docs/WORKFLOW_MAP.md docs/WORKFLOW_MAP.mmd docs/workflow-map.json .github/workflows/database-tests.yml tests/fileSecurity.test.ts
          if git diff --cached --quiet; then
            echo "No generated hardening changes to commit."
          else
            git commit -m "security: harden single-company file boundaries [skip ci]"
            git push
          fi

  migration-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - run: npm install
      - name: Start local Supabase
        run: supabase db start
      - name: Reset migration chain
        run: supabase db reset
      - name: Migration tests
        run: npm run test:migrations
      - name: Upgrade-path tests
        run: npm run test:migrations:upgrade
