name: Wave 1A Recovery Helper

on:
  push:
    branches:
      - codex/wave-1a-supplier-payable-ux
    paths:
      - .github/workflows/wave1a-recovery-helper.yml

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/wave-1a-supplier-payable-ux
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture full affected-test diagnostics
        id: tests
        shell: bash
        run: |
          mkdir -p artifacts/wave1a-recovery
          set +e
          npm run test:affected > artifacts/wave1a-recovery/affected-tests.log 2>&1
          status=$?
          set -e
          echo "$status" > artifacts/wave1a-recovery/affected-tests.exit
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Regenerate canonical workflow map outputs
        run: npm run workflow-map:generate

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave1a-recovery-${{ github.sha }}
          path: artifacts/wave1a-recovery
          if-no-files-found: error
          retention-days: 2

      - name: Commit regenerated workflow map outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/workflow-map.json docs/architecture/APP_WORKFLOW_MAP.md
          if git diff --cached --quiet; then
            echo "Workflow map outputs were already current."
            exit 0
          fi
          git commit -m "chore: regenerate Wave 1A workflow map"
          git push origin HEAD:codex/wave-1a-supplier-payable-ux
