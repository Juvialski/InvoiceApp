name: Full Regression Suite

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-application-regression:
    name: Full Application Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and Typecheck
        run: npm run lint

      - name: Full Application Test Suite
        run: npm run test:full

      - name: Production Bundle Build
        run: npm run build

      - name: Check generated workflow map
        run: npm run workflow-map:check

      - name: Check graph/source consistency
        run: npm run workflow-map:consistency

  full-database-regression:
    name: Full Database Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Step 1 - Static Migration Invariants & Naming Safety
        run: node --test --experimental-strip-types tests/migrationInvariants.test.ts tests/cashBankingMigration.test.ts tests/coreHardeningWave2B2.test.ts tests/coreHardeningWave2C.test.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase
        run: supabase start

      - name: Step 2 - Clean Database Migration Replay (Reset)
        run: supabase db reset

      - name: Step 3 - Database Schema Assertions (pgTAP)
        run: supabase test db

      - name: Step 4 - Upgrade-Path Migration Suite with Historical Data
        run: npx tsx scripts/test-migration-upgrade.ts --require-db

      - name: Stop Supabase containers
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop
          fi
