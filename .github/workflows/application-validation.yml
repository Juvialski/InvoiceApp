name: Application Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/application-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validation:
    name: Application Validation & Build
    runs-on: ubuntu-latest
    steps:
      - name: Determine validation scope
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('run', 'true');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const relevant = files.some(({ filename }) =>
              filename.startsWith('src/') ||
              filename.startsWith('tests/') ||
              filename.startsWith('scripts/') ||
              filename.startsWith('public/') ||
              /^package.*\.json$/.test(filename) ||
              filename === 'tsconfig.json' ||
              filename === '.github/workflows/application-validation.yml'
            );
            core.setOutput('run', relevant ? 'true' : 'false');
            if (!relevant) {
              core.notice('Fast-pass: no application-validation inputs changed.');
            }

      - name: Checkout repository
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Lint and Typecheck
        if: steps.scope.outputs.run == 'true'
        run: npm run lint

      - name: Run Affected Application Tests & Smoke Suite
        if: steps.scope.outputs.run == 'true'
        run: npm run test:affected:agent -- --github-summary

      - name: Production Bundle Build
        if: steps.scope.outputs.run == 'true'
        run: npm run build
