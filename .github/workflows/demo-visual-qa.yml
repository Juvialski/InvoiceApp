name: Demo Visual QA

on:
  push:
    branches:
      - main
    paths:
      - "src/app/**"
      - "src/components/**"
      - "src/demo/**"
      - "src/workflow-map/**"
      - "src/**/*.css"
      - "src/main.tsx"
      - "public/demo/**"
      - "package.json"
      - "scripts/demo-visual-qa.ts"
      - "scripts/qa/**"
      - "scripts/workflow-map/**"
      - "tests/structuredBrowserEvidence.test.ts"
      - "tests/workflowMap*.test.ts"
      - ".github/workflows/demo-visual-qa.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  chromium-demo-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Determine validation scope
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('run', 'true');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const relevant = files.some(({ filename }) =>
              filename.startsWith('src/app/') ||
              filename.startsWith('src/components/') ||
              filename.startsWith('src/demo/') ||
              filename.startsWith('src/workflow-map/') ||
              (filename.startsWith('src/') && filename.endsWith('.css')) ||
              filename === 'src/main.tsx' ||
              filename.startsWith('public/demo/') ||
              filename === 'package.json' ||
              filename === 'scripts/demo-visual-qa.ts' ||
              filename.startsWith('scripts/qa/') ||
              filename.startsWith('scripts/workflow-map/') ||
              filename === 'tests/structuredBrowserEvidence.test.ts' ||
              /^tests\/workflowMap.*\.test\.ts$/.test(filename) ||
              filename === '.github/workflows/demo-visual-qa.yml'
            );
            core.setOutput('run', relevant ? 'true' : 'false');
            if (!relevant) {
              core.notice('Fast-pass: no browser/demo QA inputs changed.');
            }

      - name: Checkout repository
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci
      - name: Lint and typecheck
        if: steps.scope.outputs.run == 'true'
        run: npm run lint
      - name: Build production bundle
        if: steps.scope.outputs.run == 'true'
        run: npm run build
      - name: Install Playwright for QA only
        if: steps.scope.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static preview
        if: steps.scope.outputs.run == 'true'
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/engoryx-demo-preview.log 2>&1 &
          echo $! > /tmp/engoryx-demo-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/demo > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/engoryx-demo-preview.log
          exit 1
      - name: Capture structured demo evidence
        if: steps.scope.outputs.run == 'true'
        run: npm run qa:demo
      - name: Generate workflow map evidence overlay
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          if [ -f "artifacts/demo-visual-qa/manifest.json" ]; then
            npm run workflow-map:evidence -- --manifest artifacts/demo-visual-qa/manifest.json
          else
            echo "No manifest.json found; skipping evidence overlay generation."
          fi
      - name: Upload visual QA evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: demo-visual-qa
          path: artifacts/demo-visual-qa
          if-no-files-found: error
          retention-days: 14
      - name: Stop preview server
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          if [ -f /tmp/engoryx-demo-preview.pid ]; then kill "$(cat /tmp/engoryx-demo-preview.pid)" 2>/dev/null || true; fi
          cat /tmp/engoryx-demo-preview.log 2>/dev/null || true
