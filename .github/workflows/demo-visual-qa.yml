name: Demo Visual QA

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package*.json"
      - "vite.config.ts"
      - "scripts/demo-visual-qa.ts"
      - "scripts/qa/**"
      - "scripts/workflow-map/**"
      - "tests/**"
      - ".github/workflows/demo-visual-qa.yml"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  chromium-demo-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect pull request changed paths
        id: changed-files
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('files', '[]');
              core.setOutput('complete', 'false');
              return;
            }

            try {
              const pullNumber = context.issue.number;
              const expectedHeadSha = context.payload.pull_request?.head?.sha;
              const expectedBaseSha = context.payload.pull_request?.base?.sha;
              if (!expectedHeadSha || !expectedBaseSha) {
                core.warning('Pull request head or base identity is unavailable; browser QA will run the full catalog.');
                core.setOutput('files', '[]');
                core.setOutput('complete', 'false');
                return;
              }

              const before = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              if (before.data.head.sha !== expectedHeadSha || before.data.base.sha !== expectedBaseSha) {
                core.warning('Pull request head or base moved after this event; browser QA will run the full catalog.');
                core.setOutput('files', '[]');
                core.setOutput('complete', 'false');
                return;
              }

              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                per_page: 100,
              });
              const after = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              const sameEventRevision = after.data.head.sha === expectedHeadSha
                && after.data.base.sha === expectedBaseSha
                && before.data.head.sha === after.data.head.sha
                && before.data.base.sha === after.data.base.sha;
              const complete = sameEventRevision && files.length === after.data.changed_files;
              if (!complete) {
                core.warning(`Changed-file list or event identity may be incomplete (${files.length} returned, ${after.data.changed_files} expected); browser QA will run the full catalog.`);
              }
              core.setOutput('files', JSON.stringify(files.map(({ filename }) => filename)));
              core.setOutput('complete', complete ? 'true' : 'false');
            } catch {
              core.warning('Could not read the complete pull request file list; browser QA will run the full catalog.');
              core.setOutput('files', '[]');
              core.setOutput('complete', 'false');
            }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/qa/browser-runtime/package-lock.json

      - name: Select browser scenarios
        id: scope
        run: node --experimental-strip-types scripts/qa/selectDemoQaScope.ts
        env:
          DEMO_QA_CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
          DEMO_QA_CHANGED_FILES_COMPLETE: ${{ steps.changed-files.outputs.complete }}

      - name: Report browser scenario scope
        run: echo "Browser QA scope=${{ steps.scope.outputs.mode }} reason=${{ steps.scope.outputs.reason }} routes=${{ steps.scope.outputs.routes }}"

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Install pinned QA Playwright package
        if: steps.scope.outputs.run == 'true'
        run: npm ci --prefix scripts/qa/browser-runtime

      - name: Build production bundle
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      - name: Install pinned Playwright Chromium
        if: steps.scope.outputs.run == 'true'
        run: npm exec --prefix scripts/qa/browser-runtime -- playwright install --with-deps chromium

      - name: Start static preview
        if: steps.scope.outputs.run == 'true'
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/engoryx-demo-preview.log 2>&1 &
          echo $! > /tmp/engoryx-demo-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/demo > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/engoryx-demo-preview.log
          exit 1

      - name: Capture structured demo evidence
        if: steps.scope.outputs.run == 'true'
        run: npm run qa:demo
        env:
          DEMO_QA_FEATURES: ${{ steps.scope.outputs.features }}

      - name: Generate workflow map evidence overlay
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          if [ -f "artifacts/demo-visual-qa/manifest.json" ]; then
            npm run workflow-map:evidence -- --manifest artifacts/demo-visual-qa/manifest.json
          else
            echo "No manifest.json found; skipping evidence overlay generation."
          fi

      - name: Upload visual QA evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: demo-visual-qa
          path: artifacts/demo-visual-qa
          if-no-files-found: error
          retention-days: 14

      - name: Stop preview server
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          if [ -f /tmp/engoryx-demo-preview.pid ]; then kill "$(cat /tmp/engoryx-demo-preview.pid)" 2>/dev/null || true; fi
          cat /tmp/engoryx-demo-preview.log 2>/dev/null || true
