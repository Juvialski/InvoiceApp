name: PR 152 null-money regression fix

on:
  push:
    branches:
      - codex/supplier-invoice-systemic-correctness

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/supplier-invoice-systemic-correctness
          fetch-depth: 0

      - name: Apply narrow null-money fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceOnce = (path, before, after) => {
            const current = fs.readFileSync(path, 'utf8');
            const first = current.indexOf(before);
            if (first === -1) throw new Error(`Expected text not found in ${path}`);
            if (current.indexOf(before, first + before.length) !== -1) throw new Error(`Expected text is not unique in ${path}`);
            fs.writeFileSync(path, current.slice(0, first) + after + current.slice(first + before.length));
          };

          const duplicatePath = 'src/utils/invoiceDuplicateDetection.ts';
          replaceOnce(
            duplicatePath,
            `const sourceMoney = (value: unknown) => {\n  if (value === undefined || value === null || (typeof value === "string" && !value.trim())) return undefined;\n  const numeric = Number(value);\n  return Number.isFinite(numeric) ? numeric : undefined;\n};`,
            `const sourceMoney = (value: unknown) => {\n  if (value === undefined || value === null || (typeof value === "string" && !value.trim())) return undefined;\n  const numeric = Number(value);\n  return Number.isFinite(numeric) ? numeric : undefined;\n};\n\nexport function supplierInvoiceDuplicateTotalsMatch(left: unknown, right: unknown): boolean {\n  const leftTotal = sourceMoney(left);\n  const rightTotal = sourceMoney(right);\n  return leftTotal !== undefined && rightTotal !== undefined && Math.abs(leftTotal - rightTotal) <= 0.02;\n}`
          );
          replaceOnce(
            duplicatePath,
            `    const sameTotal = candidateTotal !== undefined && invoiceTotal !== undefined && Math.abs(candidateTotal - invoiceTotal) <= 0.02;`,
            `    const sameTotal = supplierInvoiceDuplicateTotalsMatch(candidateTotal, invoiceTotal);`
          );

          const persistencePath = 'src/lib/persistence.ts';
          replaceOnce(
            persistencePath,
            `import { expenseFromRow } from "./expenses.ts";`,
            `import { expenseFromRow } from "./expenses.ts";\nimport { supplierInvoiceDuplicateTotalsMatch } from "../utils/invoiceDuplicateDetection.ts";`
          );
          replaceOnce(
            persistencePath,
            `    const candidateTotal = Number(candidate.grand_total);\n    const invoiceTotal = Number(invoice.grandTotal);\n    const sameTotal = Number.isFinite(candidateTotal) && Number.isFinite(invoiceTotal) && Math.abs(candidateTotal - invoiceTotal) <= 0.02;`,
            `    const sameTotal = supplierInvoiceDuplicateTotalsMatch(candidate.grand_total, invoice.grandTotal);`
          );

          const assistantPath = 'src/server/assistant/assistantToolExecutors.ts';
          replaceOnce(
            assistantPath,
            `function optionalAmount(row: Record<string, unknown>, key: string) {\n  const value = Number(row[key]);\n  return Number.isFinite(value) ? value : null;\n}`,
            `function optionalAmount(row: Record<string, unknown>, key: string) {\n  const source = row[key];\n  if (source === null || source === undefined || (typeof source === "string" && !source.trim())) return null;\n  const value = Number(source);\n  return Number.isFinite(value) ? value : null;\n}`
          );
          replaceOnce(
            assistantPath,
            `function invoiceView(row: Row) {`,
            `export function invoiceView(row: Row) {`
          );

          fs.writeFileSync('tests/pr152NullMoneyRegression.test.ts', `import assert from "node:assert/strict";\nimport test from "node:test";\nimport { invoiceView } from "../src/server/assistant/assistantToolExecutors.ts";\nimport { supplierInvoiceDuplicateTotalsMatch } from "../src/utils/invoiceDuplicateDetection.ts";\n\ntest("supplier invoice duplicate totals keep unknown values unknown while accepting real zero", () => {\n  assert.equal(supplierInvoiceDuplicateTotalsMatch(null, null), false);\n  assert.equal(supplierInvoiceDuplicateTotalsMatch(undefined, 0), false);\n  assert.equal(supplierInvoiceDuplicateTotalsMatch("", 0), false);\n  assert.equal(supplierInvoiceDuplicateTotalsMatch(0, 0), true);\n  assert.equal(supplierInvoiceDuplicateTotalsMatch("0", 0), true);\n});\n\ntest("Assistant invoice reads preserve unknown money as null and genuine zero as zero", () => {\n  const unknown = invoiceView({\n    id: "invoice-unknown",\n    grand_total: null,\n    current_data: {\n      subtotal: null,\n      totalDiscount: undefined,\n      totalTax: null,\n      amountPaid: undefined,\n      amountDue: null,\n      balanceDue: null,\n      withholdingTaxAmount: undefined,\n      netAmountPayable: null,\n    },\n  } as any);\n\n  assert.equal(unknown.grandTotal, null);\n  assert.equal(unknown.subtotal, null);\n  assert.equal(unknown.totalDiscount, null);\n  assert.equal(unknown.totalTax, null);\n  assert.equal(unknown.amountPaid, null);\n  assert.equal(unknown.amountDue, null);\n  assert.equal(unknown.balanceDue, null);\n  assert.equal(unknown.withholdingTaxAmount, null);\n  assert.equal(unknown.netAmountPayable, null);\n\n  const zero = invoiceView({\n    id: "invoice-zero",\n    grand_total: 0,\n    current_data: {\n      subtotal: 0,\n      totalDiscount: 0,\n      totalTax: 0,\n      amountPaid: 0,\n      amountDue: 0,\n      balanceDue: 0,\n      withholdingTaxAmount: 0,\n      netAmountPayable: 0,\n    },\n  } as any);\n\n  assert.equal(zero.grandTotal, 0);\n  assert.equal(zero.subtotal, 0);\n  assert.equal(zero.totalDiscount, 0);\n  assert.equal(zero.totalTax, 0);\n  assert.equal(zero.amountPaid, 0);\n  assert.equal(zero.amountDue, 0);\n  assert.equal(zero.balanceDue, 0);\n  assert.equal(zero.withholdingTaxAmount, 0);\n  assert.equal(zero.netAmountPayable, 0);\n});\n`);
          NODE

      - name: Run focused regression test
        shell: bash
        run: |
          npm ci --ignore-scripts
          node --test --experimental-strip-types tests/pr152NullMoneyRegression.test.ts

      - name: Commit narrow fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/pr152-null-money-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/persistence.ts src/server/assistant/assistantToolExecutors.ts src/utils/invoiceDuplicateDetection.ts tests/pr152NullMoneyRegression.test.ts .github/workflows/pr152-null-money-fix.yml
          git diff --cached --check
          git commit -m "fix: preserve unknown supplier invoice amounts"
          git push origin HEAD:codex/supplier-invoice-systemic-correctness
