name: Patch QA Release Documentation

on:
  push:
    branches: [fix/qa-release-direct-db-v2]
    paths: [.github/workflows/patch-qa-release-docs.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qa-release-direct-db-v2
          fetch-depth: 0
      - name: Synchronize live release documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "AGENTS.md",
              "Current state through merged PR #136:",
              "Current state through merged PR #138:",
          )

          replace_once(
              "docs/HYDROQUALISENSE_ACTIVE_ROADMAP.md",
              "Last updated: **2026-09-10**",
              "Last updated: **2026-09-11**",
          )
          replace_once(
              "docs/HYDROQUALISENSE_ACTIVE_ROADMAP.md",
              "Wave 4C Outbound Issued-Document Gmail Delivery & Delivery History is complete through PR #136.\n\nCurrent merged application baseline after the Wave 4D priority correction:\n\n`1b49eaa601d23289b4591fe6ba5a98da130430dd`",
              "Wave 4C Outbound Issued-Document Gmail Delivery & Delivery History is complete through PR #136.\nWave 4D Email/SMS + Documents workspace implementation is integrated through PR #138, but Wave 4D remains incomplete until approved provider-backed SMS is configured and runtime-tested in QA.\n\nCurrent merged application baseline after the Wave 4D workspace implementation:\n\n`41fff7149c88bbadba6e40d3e5e2da7bcdb24d4a`",
          )

          replace_once(
              "docs/HYDROQUALISENSE_CURRENT_HANDOFF.md",
              "Date: **2026-09-10**",
              "Date: **2026-09-11**",
          )
          replace_once(
              "docs/HYDROQUALISENSE_CURRENT_HANDOFF.md",
              "Current merged `main` baseline:\n\n`1b49eaa601d23289b4591fe6ba5a98da130430dd`",
              "Current merged application baseline:\n\n`41fff7149c88bbadba6e40d3e5e2da7bcdb24d4a` (PR #138; this release-infrastructure fix does not change product behavior)",
          )
          replace_once(
              "docs/HYDROQUALISENSE_CURRENT_HANDOFF.md",
              "- Wave 4C Outbound Issued-Document Gmail Delivery & Delivery History — complete through PR #136.",
              "- Wave 4C Outbound Issued-Document Gmail Delivery & Delivery History — complete through PR #136;\n- Wave 4D Email/SMS + Documents workspace implementation — integrated through PR #138, with SMS provider activation/runtime QA still blocking phase completion.",
          )

          replace_once(
              "docs/CHATGPT_MIGRATION_OPERATOR_POLICY.md",
              "The repository `qa:db:push` wrapper remains the normal CI/CLI implementation. A connected ChatGPT Supabase operation is an equally authorized operator path only when it preserves the same target and canonical-history guarantees.",
              "The repository `qa:db:push` wrapper remains the normal CI/CLI implementation. In protected GitHub Actions it uses the fixed QA Supabase Session Pooler plus the QA database password, so normal promotion does not depend on Supabase Management API project linking or a personal access token. Linked CLI mode remains available for deliberate local/bootstrap operations. A connected ChatGPT Supabase operation is an equally authorized operator path only when it preserves the same target and canonical-history guarantees.",
          )

          replace_once(
              "docs/HYDROQUALISENSE_DEPLOYMENT_RUNBOOK.md",
              "- `SUPABASE_ACCESS_TOKEN` — Supabase personal access token used only by the CLI in the protected workflow;\n",
              "",
          )
          replace_once(
              "docs/HYDROQUALISENSE_DEPLOYMENT_RUNBOOK.md",
              "- `SUPABASE_DB_PASSWORD` — QA database password used through the CLI environment, never placed in command arguments or artifacts;",
              "- `SUPABASE_DB_PASSWORD` — QA database password used by the guarded direct-database wrapper; the constructed connection URL is never printed, persisted, or stored in evidence;",
          )
          replace_once(
              "docs/HYDROQUALISENSE_DEPLOYMENT_RUNBOOK.md",
              "The workflow fails closed when either CLI secret is missing. It links only the expected QA reference, independently reads the complete QA migration history, waits for `/api/health` to report `environment=qa`, `deployment_id=qa-hydroqualisense`, the exact `main` SHA, and the repository-derived migration level, then invokes `npm run qa:db:push -- --project-ref vrpuznofrntyqsbugrib --confirm-qa` when parity is behind. It verifies the complete migration history again after promotion and only then calls the reusable Hosted QA workflow for application/runtime- or migration-bearing changes. Hosted QA failures, Render timeout/identity mismatch, authentication/linking errors, wrapper refusal, migration errors, and parity divergence fail the chain and preserve sanitized evidence artifacts.",
              "The workflow fails closed when the QA database password is missing or when the fixed QA/project/deployment/session-pooler identity does not match the protected configuration. It does not call `supabase link` or require `SUPABASE_ACCESS_TOKEN`. Instead, it uses the fixed QA Supabase Session Pooler (`aws-0-ap-southeast-1.pooler.supabase.com`) with the `postgres.vrpuznofrntyqsbugrib` database user, independently reads the complete QA migration history through `--db-url`, waits for `/api/health` to report `environment=qa`, `deployment_id=qa-hydroqualisense`, the exact `main` SHA, and the repository-derived migration level, then invokes `npm run qa:db:push -- --project-ref vrpuznofrntyqsbugrib --confirm-qa --direct-db` when parity is behind. The wrapper constructs the percent-encoded database URL in memory and never logs or persists it. It verifies the complete migration history again after promotion and only then calls the reusable Hosted QA workflow for application/runtime- or migration-bearing changes. Hosted QA failures, Render timeout/identity mismatch, database authentication/connection errors, wrapper refusal, migration errors, and parity divergence fail the chain and preserve sanitized evidence artifacts.",
          )
          replace_once(
              "docs/HYDROQUALISENSE_DEPLOYMENT_RUNBOOK.md",
              "Production is never linked, migrated, reset, or queried by this workflow.",
              "Production is never targeted, migrated, reset, or queried by this workflow.",
          )
          PY
          rm .github/workflows/patch-qa-release-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md docs .github/workflows/patch-qa-release-docs.yml
          git commit -m "docs: align protected QA direct database release"
          git push origin HEAD:fix/qa-release-direct-db-v2
