name: Finalize PHP-only demo browser QA

on:
  push:
    branches:
      - fix/php-only-demo-reporting
    paths:
      - .github/workflows/php-demo-browser-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/php-only-demo-reporting
          fetch-depth: 0
      - name: Align browser QA with PHP-only demo contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/qa/demoScenarios.ts')
          text = path.read_text(encoding='utf-8')
          pattern = r'const verifyMixedCurrencyProjectControlState: QaScenarioAction = async \(page\) => \{.*?\n\};'
          replacement = '''const verifyPhpOnlyProjectControlState: QaScenarioAction = async (page) => {
            const mixedCurrencyCount = await page.locator("text=Mixed currencies present").count();
            const withheldChartCount = await page.locator("text=Complete budget position withheld while unconverted foreign-currency costs are present.").count();
            const partialMetricCount = await page.locator('[data-financial-metric-status="partial"]').count();
            const availableMetricCount = await page.locator('[data-financial-metric-status="available"]').count();
            return [
              { id: "php-only-mixed-currency-warning-absent", passed: mixedCurrencyCount === 0, details: `mixed-currency warnings: ${mixedCurrencyCount}` },
              { id: "php-only-budget-chart-not-withheld", passed: withheldChartCount === 0, details: `withheld budget chart messages: ${withheldChartCount}` },
              { id: "php-only-financial-metrics-not-partial", passed: partialMetricCount === 0, details: `partial financial metrics: ${partialMetricCount}` },
              { id: "php-only-financial-metrics-available", passed: availableMetricCount > 0, details: `available financial metrics: ${availableMetricCount}` },
            ] satisfies readonly QaAssertion[];
          };'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one mixed-currency QA action, found {count}')
          old_ref = 'action: verifyMixedCurrencyProjectControlState'
          if text.count(old_ref) != 1:
              raise SystemExit(f'expected one mixed-currency QA action reference, found {text.count(old_ref)}')
          text = text.replace(old_ref, 'action: verifyPhpOnlyProjectControlState', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/php-demo-browser-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qa/demoScenarios.ts .github/workflows/php-demo-browser-finalize.yml
          git commit -m "test: align browser QA with PHP-only demo"
          git push origin HEAD:fix/php-only-demo-reporting
