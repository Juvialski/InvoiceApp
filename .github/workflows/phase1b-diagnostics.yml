name: Phase 1B Native Test Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/phase1b-diagnostics.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  identify-failing-native-tests:
    name: Identify failing native test files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run native tests one file at a time
        id: diagnose
        shell: bash
        run: |
          set +e
          failures=""
          for file in tests/*.test.ts; do
            echo "Checking $file"
            node --test --experimental-strip-types "$file" >/tmp/native-test-output.txt 2>&1
            code=$?
            if [ $code -ne 0 ]; then
              failures="${failures}${file}\n"
              echo "FAILED: $file"
              cat /tmp/native-test-output.txt
            fi
          done
          {
            echo 'failures<<EOF'
            printf '%b' "$failures"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -n "$failures" ]; then exit 1; fi
      - name: Comment diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURES: ${{ steps.diagnose.outputs.failures }}
        run: |
          if [ -n "$FAILURES" ]; then
            printf 'Phase 1B diagnostic found these failing native test files:\n\n```text\n%s\n```\n' "$FAILURES" > /tmp/comment.md
          else
            printf 'Phase 1B diagnostic: every native test file passes individually. The remaining failure is caused by full-suite interaction/concurrency rather than a single-file assertion.\n' > /tmp/comment.md
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
