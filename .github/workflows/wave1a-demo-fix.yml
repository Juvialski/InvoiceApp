name: Wave 1A Demo QA Fix

on:
  push:
    branches:
      - codex/wave-1a-supplier-payable-ux
    paths:
      - .github/workflows/wave1a-demo-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/wave-1a-supplier-payable-ux
          fetch-depth: 0

      - name: Repair stale Settings roadmap QA selector
        shell: bash
        run: |
          perl -0pi -e 's/HydroQualiSense Features & Roadmap/Hydroqualisense Features & Roadmap/g' scripts/qa/demoScenarios.ts
          test "$(grep -c 'Hydroqualisense Features & Roadmap' scripts/qa/demoScenarios.ts)" -eq 1
          ! grep -q 'HydroQualiSense Features & Roadmap' scripts/qa/demoScenarios.ts

      - name: Remove helper and commit fix
        shell: bash
        run: |
          rm .github/workflows/wave1a-demo-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qa/demoScenarios.ts .github/workflows/wave1a-demo-fix.yml
          git commit -m "fix: align Settings demo QA with product rename"
          git push origin HEAD:codex/wave-1a-supplier-payable-ux
