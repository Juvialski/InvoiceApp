name: Diagnose QA Direct Database Path

on:
  push:
    branches: [fix/qa-release-direct-db-v2]

permissions:
  contents: read

env:
  HYDROQUALISENSE_ENVIRONMENT: qa
  HYDROQUALISENSE_DEPLOYMENT_ID: qa-hydroqualisense
  HYDROQUALISENSE_EXPECTED_DEPLOYMENT_ID: qa-hydroqualisense
  HYDROQUALISENSE_QA_PROJECT_REF: vrpuznofrntyqsbugrib
  HYDROQUALISENSE_PRODUCTION_PROJECT_REF: qijjshdwiylojvqojxyz
  SUPABASE_CLI_BIN: supabase

jobs:
  direct-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: qa
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Read QA migration parity through the protected session pooler
        run: npx --no-install tsx scripts/qa/verify-migration-parity.ts --direct-db --phase before --output artifacts/qa-release/direct-parity.json
      - name: Dry-run the exact protected QA migration-push transport
        shell: bash
        run: |
          npx --no-install tsx -e '
            import { buildQaSessionPoolerDatabaseUrl, HYDROQUALISENSE_QA_POOLER_HOST } from "./src/lib/qaReleaseOrchestration.ts";
            import { runSupabaseCliSync } from "./scripts/qa/supabaseCli.ts";
            const databaseUrl = buildQaSessionPoolerDatabaseUrl({
              projectRef: process.env.HYDROQUALISENSE_QA_PROJECT_REF,
              password: process.env.SUPABASE_DB_PASSWORD,
              poolerHost: HYDROQUALISENSE_QA_POOLER_HOST,
            });
            try {
              runSupabaseCliSync(["db", "push", "--db-url", databaseUrl, "--dry-run", "--include-all"], { cwd: process.cwd(), env: process.env });
            } catch {
              console.error("Protected QA migration push dry-run failed.");
              process.exit(1);
            }
          '
