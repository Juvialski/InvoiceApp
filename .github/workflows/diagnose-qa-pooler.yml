name: Diagnose QA Direct Database Path

on:
  push:
    branches: [fix/qa-release-direct-db-v2]

permissions:
  contents: read

env:
  HYDROQUALISENSE_ENVIRONMENT: qa
  HYDROQUALISENSE_DEPLOYMENT_ID: qa-hydroqualisense
  HYDROQUALISENSE_EXPECTED_DEPLOYMENT_ID: qa-hydroqualisense
  HYDROQUALISENSE_QA_PROJECT_REF: vrpuznofrntyqsbugrib
  HYDROQUALISENSE_PRODUCTION_PROJECT_REF: qijjshdwiylojvqojxyz
  SUPABASE_CLI_BIN: supabase

jobs:
  direct-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: qa
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Read QA migration parity through the protected session pooler
        run: npx --no-install tsx scripts/qa/verify-migration-parity.ts --direct-db --phase before --output artifacts/qa-release/direct-parity.json
